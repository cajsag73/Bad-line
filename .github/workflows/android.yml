# Builds the Google Play package (.aab) and a test .apk for Bad Line.
# Start it from the Actions tab: "Android package" → "Run workflow".
name: Android package

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        default: '1.0.0'
        required: true
      version_code:
        description: 'Version code (a whole number, one higher for every upload)'
        default: '1'
        required: true
  push:
    branches: [android-build]

permissions:
  contents: write

concurrency:
  group: android-package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      VERSION_CODE: ${{ inputs.version_code || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Choose mode
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Add the secret ANDROID_KEY_PASSWORD first (Settings → Secrets and variables → Actions)."; exit 1
            fi
            if [ ${#KEY_PASSWORD} -lt 20 ]; then
              echo "::error::ANDROID_KEY_PASSWORD must be at least 20 characters."; exit 1
            fi
            echo "MODE=release" >> "$GITHUB_ENV"
          else
            echo "MODE=test" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=test-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          fi

      - name: Signing key
        run: |
          set -o pipefail
          mkdir -p work
          if [ "$MODE" = "release" ] && [ -f android/upload-key.p12 ]; then
            cp android/upload-key.p12 work/upload-key.p12
            echo "Using the saved upload key."
          else
            keytool -genkeypair -noprompt -keystore work/upload-key.p12 -storetype PKCS12 \
              -alias android -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Cajsa Gustafsson, O=Bad Line, C=SE"
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi
          keytool -list -v -keystore work/upload-key.p12 -storepass "$KEY_PASSWORD" -alias android \
            | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ' ' > work/fingerprint.txt
          echo "Fingerprint: $(cat work/fingerprint.txt)"

      - name: Android SDK parts
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3 | tee -a work/build.log
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tee -a work/build.log

      - name: Generate project
        run: |
          set -o pipefail
          mkdir -p work/gen && cd work/gen
          npm init -y > /dev/null
          npm i @bubblewrap/core@latest 2>&1 | tail -3
          cp ../../android/generate.js .
          KEYSTORE_PATH=../upload-key.p12 node generate.js ../twa 2>&1 | tee -a ../build.log
          cd ../twa
          sed -i -E 's/targetSdkVersion [0-9]+/targetSdkVersion 36/; s/compileSdkVersion [0-9]+/compileSdkVersion 36/; s/minSdkVersion [0-9]+/minSdkVersion 24/' app/build.gradle
          grep -nE 'SdkVersion|applicationId|versionCode|versionName' app/build.gradle | tee -a ../build.log

      - name: Build
        run: |
          set -o pipefail
          cd work/twa
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease 2>&1 | tail -60 | tee -a ../build.log

      - name: Sign
        run: |
          set -o pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          [ -d "$BT" ] || BT="$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)"
          mkdir -p out
          cp work/twa/app/build/outputs/bundle/release/app-release.aab "out/Bad Line.aab"
          jarsigner -keystore work/upload-key.p12 -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" "out/Bad Line.aab" android 2>&1 | tail -2 | tee -a work/build.log
          APK=$(ls work/twa/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$APK" work/aligned.apk
          "$BT/apksigner" sign --ks work/upload-key.p12 --ks-pass env:KEY_PASSWORD --ks-key-alias android --out "out/Bad Line.apk" work/aligned.apk
          FP=$(cat work/fingerprint.txt)
          printf '[{\n  "relation": ["delegate_permission/common.handle_all_urls"],\n  "target": {\n    "namespace": "android_app",\n    "package_name": "io.github.cajsag73.badline",\n    "sha256_cert_fingerprints": ["%s"]\n  }\n}]\n' "$FP" > out/assetlinks.json
          ls -la out | tee -a work/build.log
          {
            echo "## Bad Line $VERSION_NAME ($VERSION_CODE) – $MODE"
            echo
            echo "Upload key fingerprint (SHA-256): \`$FP\`"
            echo
            if [ "$MODE" = "test" ]; then echo "**Test build with a throwaway key. Do not upload this one.**"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the upload key and fingerprint in the repo
        if: env.MODE == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$NEW_KEY" = "1" ]; then cp work/upload-key.p12 android/upload-key.p12; fi
          cp work/fingerprint.txt android/upload-key-fingerprint.txt
          git add android/upload-key.p12 android/upload-key-fingerprint.txt
          git diff --cached --quiet || { git commit -m "Android upload key fingerprint ($VERSION_NAME)"; git push; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODE == 'release' && format('Bad-Line-{0}', env.VERSION_NAME) || 'TEST-do-not-upload' }}
          path: out/
          retention-days: 30

      - name: Publish build log (for debugging)
        if: always()
        run: |
          [ -f work/build.log ] || exit 0
          cp work/build.log /tmp/build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs 2>/dev/null && git checkout -q -B ci-logs FETCH_HEAD || git checkout -q --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          cp /tmp/build.log build.log
          echo "$GITHUB_RUN_ID $MODE ${{ job.status }}" > status.txt
          git add -f build.log status.txt
          git commit -qm "Build log $GITHUB_RUN_ID" && git push -q -f origin HEAD:ci-logs || true
